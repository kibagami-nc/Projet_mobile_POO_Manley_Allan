# Configuration des tests : base H2 en mémoire, en mode compatible PostgreSQL.
# Liquibase y crée les tables et les données de départ ; les changeSets réservés
# à PostgreSQL (hachage pgcrypto, SQL avancé) sont ignorés.
spring.datasource.url=jdbc:h2:mem:caillou-test;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Le schéma vient de Liquibase ; H2 lit les colonnes text comme des CLOB, donc pas de validation Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
